    <style>:root{--ground:#f6f8fa;--ink:#11151a;--grid:rgba(24,31,38,.07)}@media(prefers-color-scheme:dark){:root{--ground:#050608;--ink:#f4f6f8;--grid:rgba(222,231,240,.06)}}</style>
