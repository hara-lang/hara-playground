name: Browser audio CI

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/browser-audio-ci.yml
      - index.html
      - runtime.lock.json
      - scripts/build-site.mjs
      - scripts/install-pinned-runtime
      - scripts/runtime-lock.mjs
      - scripts/prepare-web-packages.mjs
      - scripts/verify-browser-audio.mjs
      - scripts/verify-supersonic-project-open.mjs
      - scripts/verify-hodos-document-project-open.mjs
      - tests/browser/**
      - tests/browser-audio-workflow.test.js
      - samples/supersonic-live/**
      - samples/hodos-document/**
      - src/main.js
      - src/hodos/**
      - src/app/**
      - src/audio/**
      - src/github/**
      - src/runtime/**
      - src/workspace/**
      - vendor/hara-ui
      - vendor/hodos
  push:
    branches: [main]
    paths:
      - .github/workflows/browser-audio-ci.yml
      - index.html
      - runtime.lock.json
      - scripts/build-site.mjs
      - scripts/install-pinned-runtime
      - scripts/runtime-lock.mjs
      - scripts/prepare-web-packages.mjs
      - scripts/verify-browser-audio.mjs
      - scripts/verify-supersonic-project-open.mjs
      - scripts/verify-hodos-document-project-open.mjs
      - tests/browser/**
      - tests/browser-audio-workflow.test.js
      - samples/supersonic-live/**
      - samples/hodos-document/**
      - src/main.js
      - src/hodos/**
      - src/app/**
      - src/audio/**
      - src/github/**
      - src/runtime/**
      - src/workspace/**
      - vendor/hara-ui
      - vendor/hodos
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-audio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned browser test tooling
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium

      - name: Install the checksum-verified Hara Studio runtime
        run: npm run runtime:download

      - name: Exercise the isolated Web Audio engine
        run: node scripts/verify-browser-audio.mjs

      - name: Open the complete Supersonic project
        run: node scripts/verify-supersonic-project-open.mjs

      - name: Open the Hodos 2D document project
        run: node scripts/verify-hodos-document-project-open.mjs
