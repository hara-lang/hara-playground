name: Publish Hodos 2D browser proof success

on:
  push:
    branches: [agent/hodos-2d-browser-proof]
    paths: [.github/workflows/publish-hodos-2d-browser-proof.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-2d-browser-proof
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run repository gates
        run: |
          npm test
          npm run check
          npm run build

      - name: Install pinned browser test tooling
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium

      - name: Install the checksum-verified Hara Studio runtime
        run: npm run runtime:download

      - name: Exercise the isolated Web Audio engine
        run: node scripts/verify-browser-audio.mjs

      - name: Open the complete Supersonic project
        run: node scripts/verify-supersonic-project-open.mjs

      - name: Open the Hodos 2D document project
        run: node scripts/verify-hodos-document-project-open.mjs

      - name: Open the Hodos 2D graph project
        run: node scripts/verify-hodos-graph-project-open.mjs

      - name: Publish the passed proof ref
        run: git push --force origin HEAD:refs/heads/agent/hodos-2d-browser-proof-passed
