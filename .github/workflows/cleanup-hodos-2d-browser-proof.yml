name: Clean completed Hodos 2D proof branch

on:
  push:
    branches: [agent/hodos-2d-browser-proof]
    paths: [.github/workflows/cleanup-hodos-2d-browser-proof.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-2d-browser-proof
          fetch-depth: 0

      - name: Remove proof-only machinery
        run: |
          git rm -f \
            .github/workflows/verify-hodos-2d-browser-proof.yml \
            .github/workflows/publish-hodos-2d-browser-proof.yml \
            .github/workflows/cleanup-hodos-2d-browser-proof.yml
          if [ -e hodos-2d-browser-proof.json ]; then
            git rm -f hodos-2d-browser-proof.json
          fi

      - name: Commit the clean final branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "Remove completed Hodos 2D proof machinery"
          git push origin HEAD:agent/hodos-2d-browser-proof
