name: Apply Hodos 2D Document consumer migration

on:
  push:
    branches: [agent/hodos-2d-document-consumer]
    paths: [.github/workflows/apply-hodos-document-consumer.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-2d-document-consumer
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the migration program
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/scripts/apply-hodos-document-consumer.py').read_text(encoding='utf-8')
          compile(source, '.github/scripts/apply-hodos-document-consumer.py', 'exec')
          PY

      - name: Align repeated browser-workflow migration anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-hodos-document-consumer.py')
          source = path.read_text(encoding='utf-8')
          start_marker = '    for label in ("pull", "push"):\n'
          end_marker = "    source = replace_once(\n        source,\n        '      - name: Open the complete Supersonic project"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Unable to locate the browser-workflow migration block')

          replacement = (
              "    script_anchor = '      - scripts/verify-supersonic-project-open.mjs\\n'\n"
              "    script_count = source.count(script_anchor)\n"
              "    if script_count != 2:\n"
              "        raise SystemExit(\n"
              "            f\"Hodos Document browser script paths: expected two matches, found {script_count}\"\n"
              "        )\n"
              "    source = source.replace(\n"
              "        script_anchor,\n"
              "        script_anchor + '      - scripts/verify-hodos-document-project-open.mjs\\n',\n"
              "    )\n"
              "\n"
              "    sample_anchor = '      - samples/supersonic-live/**\\n'\n"
              "    sample_count = source.count(sample_anchor)\n"
              "    if sample_count != 2:\n"
              "        raise SystemExit(\n"
              "            f\"Hodos Document sample paths: expected two matches, found {sample_count}\"\n"
              "        )\n"
              "    source = source.replace(\n"
              "        sample_anchor,\n"
              "        sample_anchor + '      - samples/hodos-document/**\\n',\n"
              "    )\n"
          )
          source = source[:start] + replacement + source[end:]
          compile(source, str(path), 'exec')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Pin the merged Hodos 2D document host
        run: |
          git -C vendor/hodos fetch origin b5e427061d92e015cd3882b03b1d6438630fa466
          git -C vendor/hodos checkout b5e427061d92e015cd3882b03b1d6438630fa466

      - name: Apply the manifest-native Hodos Document consumer
        run: python3 .github/scripts/apply-hodos-document-consumer.py

      - name: Align existing compatibility gates with the new surface
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).write_text(content, encoding='utf-8')

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          state_path = 'src/hodos/workspace-shell-state.js'
          source = read(state_path)
          source = replace_once(
              source,
              '  const selectedAreaId = selectedSurface?.["surface/area"] || ids.editor;\n',
              '  const selectedProjectedAreaId = selectedSurface?.["surface/area"] || ids.editor;\n',
              'selected projected area declaration',
          )
          source = replace_once(
              source,
              '      "area/id": selectedAreaId,\n',
              '      "area/id": selectedProjectedAreaId,\n',
              'selected projected area use',
          )
          write(state_path, source)

          prepare_path = 'scripts/prepare-web-packages.mjs'
          source = read(prepare_path)
          source = replace_once(
              source,
              '    marker: "vendor/hodos/packages/2d-ui/src/document-dom-host.js",\n',
              '    marker: "vendor/hodos/packages/dev-ui/src/index.js",\n',
              'shared Hodos checkout marker',
          )
          write(prepare_path, source)

          test_path = 'tests/hodos-document-consumer.test.js'
          source = read(test_path)
          source = replace_once(
              source,
              '      const [html, shell, styles, prepare, manifest] = await Promise.all([\n',
              '      const [html, shell, styles, manifest] = await Promise.all([\n',
              'document consumer fixture bindings',
          )
          source = replace_once(
              source,
              '        read("../scripts/prepare-web-packages.mjs"),\n',
              '',
              'document consumer preparation fixture',
          )
          source = replace_once(
              source,
              '      assert.match(prepare, /2d-ui\\/src\\/document-dom-host\\.js/);\n',
              '',
              'document consumer preparation assertion',
          )
          write(test_path, source)

          browser_test = 'tests/browser-audio-workflow.test.js'
          source = read(browser_test)
          source = replace_once(
              source,
              '  assert.match(workflow, /scripts\\/verify-supersonic-project-open\\.mjs/);\n',
              '  assert.match(workflow, /scripts\\/verify-supersonic-project-open\\.mjs/);\n  assert.match(workflow, /scripts\\/verify-hodos-document-project-open\\.mjs/);\n  assert.match(workflow, /samples\\/hodos-document\\/\\*\\*/);\n',
              'browser Hodos Document paths',
          )
          source = replace_once(
              source,
              '    "scripts/verify-supersonic-project-open.mjs"\n',
              '    "scripts/verify-supersonic-project-open.mjs",\n    "scripts/verify-hodos-document-project-open.mjs"\n',
              'browser runner list',
          )
          write(browser_test, source)

          catalog_test = 'tests/project-catalog.test.js'
          source = read(catalog_test)
          source = replace_once(
              source,
              '  assert.equal(FEATURED_PROJECTS.length, 4);\n',
              '  assert.equal(FEATURED_PROJECTS.length, 5);\n',
              'featured project count',
          )
          write(catalog_test, source)

          write('samples/hodos-document/project.edn', '''{:hara/type :project
           :hara/version "1.0.0"
           :project/id playground.hodos-document
           :project/version "0.1.0"
           :project/source-paths ["src"]
           :project/test-paths ["test"]
           :project/extension-paths ["extensions"]
           :project/main playground.hodos-document
           :project/capabilities
           #{:studio/eval}}
          ''')

          write('samples/hodos-document/src/main.hal', '''(ns playground.hodos-document)

          (def answer
            (* 6 7))

          (defn view []
            [:main {:class "preview-shell"}
             [:article {:class "card"}
              [:span {:class "eyebrow"} "HODOS 2D"]
              [:h1 "Inspectable document"]
              [:p "The committed answer is " answer]]])

          (view)
          ''')

          write('samples/hodos-document/workspace.edn', '''{:hara/type :workspace
           :hara/version "1.0.0"
           :workspace/id :playground-hodos-document
           :workspace/revision 0
           :workspace/layout
           {:layout/type :split
            :layout/id :layout/root
            :layout/direction :horizontal
            :layout/ratio 0.2
            :layout/first {:layout/type :area :layout/area "area/project"}
            :layout/second
            {:layout/type :split
             :layout/id :layout/work
             :layout/direction :horizontal
             :layout/ratio 0.44
             :layout/first {:layout/type :area :layout/area "area/editor"}
             :layout/second
             {:layout/type :split
              :layout/id :layout/document-output
              :layout/direction :vertical
              :layout/ratio 0.72
              :layout/first {:layout/type :area :layout/area "area/document"}
              :layout/second {:layout/type :area :layout/area "area/output"}}}}
           :workspace/documents
           [{:document/id "document/source"
             :document/path "src/main.hal"
             :document/title "main.hal"
             :document/language :hal
             :document/dirty? false}
            {:document/id "document/review"
             :document/profile "hodos.rich-text/2"}]
           :workspace/areas
           [{:area/id "area/project"
             :area/type :project
             :area/title "Project"
             :area/presentation
             {:presentation/role :project
              :presentation/label "Files"}}
            {:area/id "area/editor"
             :area/type :code-editor
             :area/title "main.hal"
             :area/presentation
             {:presentation/role :editor
              :presentation/label "Code"}}
            {:area/id "area/output"
             :area/type :output
             :area/title "Preview"
             :area/presentation
             {:presentation/role :output
              :presentation/label "Canvas"}}
            {:area/id "area/document"
             :area/type "hodos.2d/document"
             :area/title "Inspectable document"
             :area/presentation
             {:presentation/label "Document"
              :presentation/icon :document
              :presentation/surface :document
              :presentation/mode :document
              :presentation/order 2
              :presentation/compact true
              :presentation/auto-focus true}
             :area/component
             {:component/id "hodos.2d/document"
              :component/contract "workspace.component/1"
              :component/model
              {:document
               {:profile "hodos.rich-text/2"
                :id "document/review"
                :title "Inspectable documents"
                :revision 0
                :metadata {:source "workspace.edn" :authority "playground"}
                :children
                [{:id "block/title"
                  :type "heading"
                  :attrs {:level 1}
                  :children [{:id "text/title" :type "text" :text "Inspectable documents"}]}
                 {:id "block/intro"
                  :type "paragraph"
                  :attrs {}
                  :children [{:id "text/intro" :type "text" :text "Edit this sentence. The stable text identity survives each Hodos update."}]}
                 {:id "block/artefact"
                  :type "hara-artefact"
                  :attrs
                  {:artefactId "artefact/answer"
                   :kind "value"
                   :title "Committed Hara value"
                   :mode "snapshot"
                   :entry "playground.hodos-document/answer"
                   :capabilities []
                   :snapshotRoot "sha256:answer-42"
                   :snapshotDisplay "42"
                   :snapshotMediaType "application/edn"
                   :snapshotSourceRoot "sha256:source-answer"
                   :metadata {:committed true}}
                  :children [{:id "text/artefact-source" :type "text" :text "answer"}]}]}
               :selection {:nodeId "block/intro" :anchor nil :focus nil}
               :status "ready"
               :readOnly false
               :capabilities
               {:select true
                :editText true
                :insertBlock false
                :deleteBlock false
                :activateArtefact false
                :commitArtefact false
                :command false}
               :error nil}
              :component/events
              ["document/select"
               "document/edit-text"
               "document/insert-block"
               "document/delete-block"
               "document/activate-artefact"
               "document/commit-artefact"
               "document/command"]}}]
           :workspace/nodes []
           :workspace/connections []
           :workspace/links
           [{:link/id "link/source-editor"
             :link/document "document/source"
             :link/area "area/editor"}
            {:link/id "link/review-document"
             :link/document "document/review"
             :link/area "area/document"}]
           :workspace/selection
           {:area/id "area/document"
            :document/id "document/review"
            :surface/id "document"}
           :workspace/customizations
           {:responsive/breakpoint 1000
            :responsive/default-surface "document"
            :recovery/journal true}
           :workspace/extensions []
           :workspace/pending []
           :workspace/audit []}
          ''')
          PY

      - name: Validate changed JavaScript
        run: |
          node --check src/hodos/document-events.js
          node --check src/hodos/document-state.js
          node --check src/hodos/workspace-shell.js
          node --check src/hodos/workspace-shell-state.js
          node --check src/app/events.js
          node --check src/studio/projects.js
          node --check scripts/verify-hodos-document-project-open.mjs
          node --check tests/hodos-document-events.test.js
          node --check tests/hodos-document-state.test.js
          node --check tests/hodos-document-consumer.test.js

      - name: Run the complete Playground gates
        run: |
          npm test
          npm run check
          npm run build

      - name: Commit the validated consumer migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mount manifest-native documents through Hodos 2D"
          git push origin HEAD:agent/hodos-2d-document-consumer
