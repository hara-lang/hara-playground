name: Apply Hodos 2D Document consumer migration

on:
  push:
    branches: [agent/hodos-2d-document-consumer]
    paths: [.github/workflows/apply-hodos-document-consumer.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-2d-document-consumer
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the migration program
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/scripts/apply-hodos-document-consumer.py').read_text(encoding='utf-8')
          compile(source, '.github/scripts/apply-hodos-document-consumer.py', 'exec')
          PY

      - name: Align repeated browser-workflow migration anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-hodos-document-consumer.py')
          source = path.read_text(encoding='utf-8')
          start_marker = '    for label in ("pull", "push"):\n'
          end_marker = "    source = replace_once(\n        source,\n        '      - name: Open the complete Supersonic project"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Unable to locate the browser-workflow migration block')

          replacement = (
              "    script_anchor = '      - scripts/verify-supersonic-project-open.mjs\\n'\n"
              "    script_count = source.count(script_anchor)\n"
              "    if script_count != 2:\n"
              "        raise SystemExit(\n"
              "            f\"Hodos Document browser script paths: expected two matches, found {script_count}\"\n"
              "        )\n"
              "    source = source.replace(\n"
              "        script_anchor,\n"
              "        script_anchor + '      - scripts/verify-hodos-document-project-open.mjs\\n',\n"
              "    )\n"
              "\n"
              "    sample_anchor = '      - samples/supersonic-live/**\\n'\n"
              "    sample_count = source.count(sample_anchor)\n"
              "    if sample_count != 2:\n"
              "        raise SystemExit(\n"
              "            f\"Hodos Document sample paths: expected two matches, found {sample_count}\"\n"
              "        )\n"
              "    source = source.replace(\n"
              "        sample_anchor,\n"
              "        sample_anchor + '      - samples/hodos-document/**\\n',\n"
              "    )\n"
          )
          source = source[:start] + replacement + source[end:]
          compile(source, str(path), 'exec')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Pin the merged Hodos 2D document host
        run: |
          git -C vendor/hodos fetch origin b5e427061d92e015cd3882b03b1d6438630fa466
          git -C vendor/hodos checkout b5e427061d92e015cd3882b03b1d6438630fa466

      - name: Apply the manifest-native Hodos Document consumer
        run: python3 .github/scripts/apply-hodos-document-consumer.py

      - name: Validate changed JavaScript
        run: |
          node --check src/hodos/document-events.js
          node --check src/hodos/document-state.js
          node --check src/hodos/workspace-shell.js
          node --check src/hodos/workspace-shell-state.js
          node --check src/app/events.js
          node --check src/studio/projects.js
          node --check scripts/verify-hodos-document-project-open.mjs
          node --check tests/hodos-document-events.test.js
          node --check tests/hodos-document-state.test.js
          node --check tests/hodos-document-consumer.test.js

      - name: Run the complete Playground gates
        run: |
          npm test
          npm run check
          npm run build

      - name: Commit the validated consumer migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mount manifest-native documents through Hodos 2D"
          git push origin HEAD:agent/hodos-2d-document-consumer
