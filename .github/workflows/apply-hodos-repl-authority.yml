name: Apply Hodos REPL authority migration

on:
  push:
    branches: [agent/hodos-repl-authority]
    paths: [.github/workflows/apply-hodos-repl-authority.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-repl-authority
      - name: Route REPL state through Hodos semantic events
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          context = Path("src/app/context.js")
          source = context.read_text()
          source = replace_once(
              source,
              'metadata: store.metadata, repl: [], history: [], historyIndex: 0,',
              'metadata: store.metadata, repl: [], replInput: "", history: [], historyIndex: 0,',
              "REPL input state",
          )
          context.write_text(source)

          main = Path("src/main.js")
          source = main.read_text()
          source = replace_once(
              source,
              'import { disposeHodosPreview, mountHodosPreview } from "./hodos/preview.js";',
              'import { disposeHodosPreview, mountHodosPreview } from "./hodos/preview.js";\nimport { disposeHodosRepl, mountHodosRepl } from "./hodos/repl.js";',
              "REPL main import",
          )
          source = replace_once(
              source,
              '  disposeHodosEditor();\n  disposeHodosPreview();',
              '  disposeHodosEditor();\n  disposeHodosPreview();\n  disposeHodosRepl();',
              "REPL disposal",
          )
          source = replace_once(
              source,
              '  mountHodosPreview({ document: state.preview, theme: state.theme });',
              '  mountHodosPreview({ document: state.preview, theme: state.theme });\n  mountHodosRepl(state);',
              "REPL mount",
          )
          main.write_text(source)

          view = Path("src/app/view.js")
          source = view.read_text()
          source = replace_once(
              source,
              'import { highlightHara } from "../editor/lisp.js";',
              'import { highlightHara } from "../editor/lisp.js";\nimport { updateHodosRepl } from "../hodos/repl.js";',
              "REPL view import",
          )
          source = replace_once(
              source,
              '''export function updateReplOnly() {
            const output = document.querySelector("#repl-output");
            if (!output) return;
            output.innerHTML = renderRepl();
            output.scrollTop = output.scrollHeight;
          }
          ''',
              '''export function updateReplOnly() {
            if (updateHodosRepl(state)) return;
            const output = document.querySelector("#repl-output");
            if (!output) return;
            output.innerHTML = renderRepl();
            output.scrollTop = output.scrollHeight;
          }
          ''',
              "REPL view update",
          )
          view.write_text(source)

          events = Path("src/app/events.js")
          source = events.read_text()
          source = replace_once(
              source,
              'import { editorWorkspacePatch } from "../hodos/editor-events.js";',
              'import { editorWorkspacePatch } from "../hodos/editor-events.js";\nimport { replWorkspacePatch } from "../hodos/repl-events.js";',
              "REPL event import",
          )

          start = source.index('function handleHodosWorkspaceEvent(event) {')
          end = source.index('function bindProjectLobbyEvents() {', start)
          handler = '''function applyEditorWorkspacePatch(patch) {
            const editor = document.querySelector("#editor");
            if (patch.kind === "change") {
              state.content = patch.source;
              state.dirty = true;
              applyEditorWorkspaceSelection(patch.selection, { highlight: false });
              updateEditorOnly();
              clearTimeout(getSaveTimer());
              setSaveTimer(setTimeout(() => saveCurrentFile(false), 900));
              scheduleInstantEvaluation(editor);
              scheduleCompletion(editor);
              return;
            }

            applyEditorWorkspaceSelection(patch.selection);
            scheduleInstantEvaluation(editor, { delay: 160 });
            if (!state.editor.completion.open) scheduleCompletion(editor, { delay: 100 });
          }

          async function applyReplWorkspacePatch(patch) {
            if (patch.kind === "input") {
              state.replInput = patch.source;
              return;
            }
            if (patch.kind === "clear") {
              state.repl = [];
              updateReplOnly();
              return;
            }
            if (patch.kind === "history") {
              state.historyIndex = Math.max(0, Math.min(
                state.history.length,
                state.historyIndex + patch.direction,
              ));
              state.replInput = state.history[state.historyIndex] || "";
              updateReplOnly();
              queueMicrotask(() => document.querySelector("#repl-input")?.focus());
              return;
            }
            if (patch.kind === "cancel") {
              runtime.cancel?.();
              return;
            }
            if (patch.kind !== "submit" || !patch.source.trim()) return;

            state.replInput = "";
            state.history.push(patch.source);
            state.historyIndex = state.history.length;
            updateReplOnly();
            await evaluate(patch.source);
          }

          function handleHodosWorkspaceEvent(event) {
            try {
              const editorPatch = editorWorkspacePatch(event.detail, state.content);
              if (editorPatch) {
                applyEditorWorkspacePatch(editorPatch);
                return;
              }
              const replPatch = replWorkspacePatch(event.detail);
              if (replPatch) void applyReplWorkspacePatch(replPatch);
            } catch (error) {
              appendRepl("error", `Workspace event rejected: ${error.message}`);
              updateReplOnly();
            }
          }

          '''
          source = source[:start] + handler + source[end:]

          bind_start = source.index('function bindWorkbenchEvents() {')
          direct_start = source.index('  document.querySelector("#clear-repl-button")?.addEventListener', bind_start)
          direct_end = source.index('\n}\n\nexport function bindEvents()', direct_start)
          source = source[:direct_start] + source[direct_end:]
          events.write_text(source)

          Path(".github/workflows/apply-hodos-repl-authority.yml").unlink()
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/context.js src/app/events.js src/app/view.js src/main.js .github/workflows/apply-hodos-repl-authority.yml
          git commit -m "Make Hodos REPL events authoritative"
          git push origin HEAD:agent/hodos-repl-authority
