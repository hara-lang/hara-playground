name: Repair Hodos Problems authority gate

on:
  push:
    branches: [agent/hodos-problems]
    paths: [.github/workflows/repair-hodos-problems-gate.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-problems
          fetch-depth: 0

      - name: Narrow the diagnostic authority assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('.github/scripts/apply-hodos-problems.py')
          source = script.read_text(encoding='utf-8')
          lines = source.splitlines()
          matches = [
              index for index, line in enumerate(lines)
              if 'assert.doesNotMatch(events' in line
              and 'appendRepl' in line
              and 'stdout' in line
          ]
          if len(matches) != 1:
              raise SystemExit(f'diagnostic assertion matches: {len(matches)}')
          index = matches[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = indent + 'assert.match(events, /runtime\\.addEventListener\\("stdout"/);'
          source = '\n'.join(lines) + '\n'

          old_terminator = "    ''']\n    source = replace_once(source, insertion_anchor"
          new_terminator = "    '''\n    source = replace_once(source, insertion_anchor"
          if source.count(old_terminator) != 1:
              raise SystemExit('Problems policy terminator did not match exactly once')
          source = source.replace(old_terminator, new_terminator, 1)
          script.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/apply-hodos-problems.yml')
          workflow_lines = workflow.read_text(encoding='utf-8').splitlines()
          starts = [
              index for index, line in enumerate(workflow_lines)
              if line.strip() == '- name: Validate the migration program'
          ]
          ends = [
              index for index, line in enumerate(workflow_lines)
              if line.strip() == '- name: Pin the merged Hodos Problems boundary'
          ]
          if len(starts) != 1 or len(ends) != 1 or ends[0] <= starts[0]:
              raise SystemExit('migration validation step boundaries are invalid')
          replacement = [
              '      - name: Validate the migration program',
              '        run: python3 -m py_compile .github/scripts/apply-hodos-problems.py',
              '',
          ]
          workflow_lines[starts[0]:ends[0]] = replacement
          workflow.write_text('\n'.join(workflow_lines) + '\n', encoding='utf-8')

          Path('.github/workflows/repair-hodos-problems-gate.yml').unlink()
          PY

      - name: Commit the focused gate repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Narrow the Hodos Problems diagnostic authority test"
          git push origin HEAD:agent/hodos-problems
