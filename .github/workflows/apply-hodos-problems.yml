name: Apply Hodos Problems consumer migration

on:
  push:
    branches: [agent/hodos-problems]
    paths: [.github/workflows/apply-hodos-problems.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-problems
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the migration program
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-hodos-problems.py')
          source = path.read_text(encoding='utf-8')
          old = "    ''']\n    source = replace_once(source, insertion_anchor"
          new = "    '''\n    source = replace_once(source, insertion_anchor"
          if source.count(old) != 1:
              raise SystemExit('Problems policy terminator did not match exactly once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/apply-hodos-problems.py

      - name: Pin the merged Hodos Problems boundary
        run: |
          git -C vendor/hodos fetch origin 1eb77a47a44de7d4b84d610f499063aa1a1bc296
          git -C vendor/hodos checkout 1eb77a47a44de7d4b84d610f499063aa1a1bc296

      - name: Apply the Playground consumer slice
        run: python3 .github/scripts/apply-hodos-problems.py

      - name: Validate changed JavaScript
        run: |
          node --check src/hodos/problems-state.js
          node --check src/hodos/problems-events.js
          node --check src/hodos/problems.js
          node --check src/app/context.js
          node --check src/app/actions.js
          node --check src/app/events.js
          node --check src/app/view.js
          node --check src/app/view-helpers.js
          node --check src/main.js
          node --check tests/hodos-problems-state.test.js
          node --check tests/hodos-problems-events.test.js
          node --check tests/hodos-problems-authority.test.js

      - name: Run the complete Playground gates
        run: |
          npm test
          npm run check
          npm run build

      - name: Commit the validated consumer migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mount diagnostics through Hodos Dev"
          git push origin HEAD:agent/hodos-problems
