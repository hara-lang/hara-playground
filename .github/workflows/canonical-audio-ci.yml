name: Canonical audio CI

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/canonical-audio-ci.yml
      - src/audio/gw.audio.supersonic.hal
      - src/runtime/canonical.js
      - src/runtime/host.js
      - scripts/verify-live-supersonic.mjs
      - tests/canonical-runtime.test.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-audio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HARA_RUNTIME_SOURCE_REF: c3c345f0e0d18d499c39d82b8f4bcb98e4ebb4f6
      HARA_UI_SOURCE_REF: 145a9acc728f71f9aa215868a22774ea07d466d4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check out the verified Hara runtime
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_RUNTIME_SOURCE_REF }}
          path: .hara-runtime-source
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the pinned Hara UI input
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-ui
          ref: ${{ env.HARA_UI_SOURCE_REF }}
          path: .hara-runtime-source/website/vendor/hara-ui
          fetch-depth: 1
          persist-credentials: false

      - name: Build and install the canonical Studio runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/hara-studio-runtime"
          HARA_STUDIO_RUNTIME_OUT="$OUT" \
            .hara-runtime-source/scripts/build-studio-runtime ci
          ARCHIVE="$OUT/hara-studio-runtime-ci.tar.gz"
          sha256sum -c "$ARCHIVE.sha256"
          rm -rf runtime
          mkdir -p runtime
          tar -xzf "$ARCHIVE" -C runtime
          test -f runtime/rust/packages/hta/index.js
          test -f runtime/rust/studio/hal/supersonic.hal

      - name: Run repository validation
        run: npm run validate

      - name: Install pinned Chromium tooling
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium

      - name: Exercise graph publication, Play, live update and Stop
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173 node scripts/dev-server.mjs >"$RUNNER_TEMP/playground.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          HARA_PLAYGROUND_URL=http://127.0.0.1:4173/ \
            node scripts/verify-live-supersonic.mjs
