name: Materialize visual Playground source

on:
  push:
    branches:
      - agent/visual-playground-editor
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/visual-playground-editor' || github.ref_name == 'agent/visual-playground-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/visual-playground-editor
      - name: Expand the validated source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/hara-playground-changes.tar.gz
          gzip -t /tmp/hara-playground-changes.tar.gz
          tar -xzf /tmp/hara-playground-changes.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-visual-playground.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build visual Hara Playground with structural kernel editor"
          git push origin HEAD:agent/visual-playground-editor
