name: Materialize visual Playground source

on:
  push:
    branches:
      - agent/visual-playground-editor
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/visual-playground-editor' || github.ref_name == 'agent/visual-playground-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/visual-playground-editor
      - name: Expand the validated source bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          paths = sorted(Path('.bootstrap').glob('part-*'))
          pieces = [path.read_text() for path in paths]
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          clean = ''.join(character for piece in pieces for character in piece if character in alphabet)
          print('fragments:', [(path.name, len(piece)) for path, piece in zip(paths, pieces)])
          print('base64:', {'length': len(clean), 'mod4': len(clean) % 4, 'padding': clean.count('='), 'first_padding': clean.find('=')})
          payload = base64.b64decode(clean, validate=True)
          gzip.decompress(payload)
          Path('/tmp/hara-playground-changes.tar.gz').write_bytes(payload)
          PY
          tar -xzf /tmp/hara-playground-changes.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-visual-playground.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build visual Hara Playground with structural kernel editor"
          git push origin HEAD:agent/visual-playground-editor
