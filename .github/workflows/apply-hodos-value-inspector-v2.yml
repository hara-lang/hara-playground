name: Apply Hodos value inspector migration v2

on:
  push:
    branches: [agent/hodos-value-inspector-v2]
    paths: [.github/workflows/apply-hodos-value-inspector-v2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-value-inspector-v2
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin the merged Hodos Value Inspector boundary
        run: |
          git -C vendor/hodos fetch origin e14b9acf1d7215d9ab963d10593e87dd8594e0e9
          git -C vendor/hodos checkout e14b9acf1d7215d9ab963d10593e87dd8594e0e9

      - name: Apply the Playground consumer slice
        run: python3 .github/scripts/apply-hodos-value-inspector.py

      - name: Validate JavaScript syntax
        run: |
          node --check src/hodos/value-projector.js
          node --check src/hodos/value-inspector-events.js
          node --check src/hodos/value-inspector.js
          node --check src/hodos/repl.js
          node --check src/hodos/repl-events.js
          node --check src/app/context.js
          node --check src/app/actions.js
          node --check src/app/events.js
          node --check src/app/view.js
          node --check src/main.js

      - name: Run the complete Playground gates
        run: |
          npm test
          npm run check
          npm run build

      - name: Commit the validated consumer migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mount retained values through Hodos Dev"
          git push origin HEAD:agent/hodos-value-inspector-v2
