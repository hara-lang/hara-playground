name: Prepare Hara runtime update
run-name: Prepare Hara Studio runtime ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable Hara release version, without the v prefix
        required: true
        default: 0.1.2

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: hara-runtime-update-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate update request
        id: release
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must be a stable semantic version without a v prefix" >&2
            exit 1
          }
          CURRENT=$(node -p 'require("./runtime.lock.json").version')
          node -e '
            const current = process.argv[1].split(".").map(Number);
            const next = process.argv[2].split(".").map(Number);
            const order = next.findIndex((part, index) => part !== current[index]);
            if (order < 0 || next[order] < current[order]) {
              throw new Error(`runtime ${process.argv[2]} does not advance current pin ${process.argv[1]}`);
            }
          ' "$CURRENT" "$VERSION"
          BRANCH="agent/hara-runtime-${VERSION//./-}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "branch already exists: $BRANCH" >&2
            exit 1
          fi
          ASSET="hara-studio-runtime-$VERSION.tar.gz"
          URL="https://github.com/hara-lang/hara/releases/download/v$VERSION/$ASSET"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download and verify the immutable release asset
        id: checksum
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hara-runtime-release"
          ARCHIVE="$RUNNER_TEMP/hara-runtime-release/${{ steps.release.outputs.asset }}"
          CHECKSUM="$ARCHIVE.sha256"
          curl --fail --location --retry 3 --output "$ARCHIVE" "${{ steps.release.outputs.url }}"
          curl --fail --location --retry 3 --output "$CHECKSUM" "${{ steps.release.outputs.url }}.sha256"
          EXPECTED=$(node scripts/runtime-lock.mjs checksum "$CHECKSUM")
          ACTUAL=$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)
          [ "$ACTUAL" = "$EXPECTED" ] || {
            echo "release checksum mismatch: expected $EXPECTED, received $ACTUAL" >&2
            exit 1
          }
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "sha256=$EXPECTED" >> "$GITHUB_OUTPUT"

      - name: Create the Supersonic-complete runtime lock
        shell: bash
        run: |
          git switch -c "${{ steps.release.outputs.branch }}"
          node scripts/runtime-lock.mjs create \
            "$VERSION" \
            "${{ steps.release.outputs.url }}" \
            "${{ steps.checksum.outputs.checksum_file }}" \
            runtime.lock.json \
            --supersonic

      - name: Install and validate the pinned runtime
        env:
          HARA_STUDIO_RUNTIME_ARCHIVE: ${{ steps.checksum.outputs.archive }}
        run: |
          npm run runtime:download
          test -f runtime/rust/studio/supersonic.js
          test -f runtime/rust/studio/hal/supersonic.hal
          npm run validate

      - name: Guard the generated change scope
        shell: bash
        run: |
          mapfile -t CHANGED < <(git status --short --untracked-files=no | awk '{print $2}')
          [ "${#CHANGED[@]}" -eq 1 ] && [ "${CHANGED[0]}" = "runtime.lock.json" ] || {
            printf 'unexpected tracked changes:\n' >&2
            printf '  %s\n' "${CHANGED[@]}" >&2
            exit 1
          }

      - name: Commit the verified pin and open a draft pull request
        id: pull_request
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime.lock.json
          git commit -m "Pin Hara Studio runtime $VERSION"
          git push -u origin "${{ steps.release.outputs.branch }}"

          BODY="$RUNNER_TEMP/runtime-update-pr.md"
          cat > "$BODY" <<EOF
          ## What changed

          - pins Hara Studio runtime \`$VERSION\`
          - uses the immutable release asset from \`hara-lang/hara@v$VERSION\`
          - records SHA-256 \`${{ steps.checksum.outputs.sha256 }}\`
          - requires the canonical adapter, Supersonic provider, and Supersonic HAL namespace

          ## Automated validation

          The release-sync workflow:

          - downloaded the archive and its official checksum file
          - independently recomputed and matched the archive SHA-256
          - generated the runtime lock through the validated lock schema
          - installed the archive through the atomic pinned-runtime installer
          - verified \`rust/studio/supersonic.js\`
          - verified \`rust/studio/hal/supersonic.hal\`
          - passed the complete Play test, syntax-check, and production-build suite
          - confirmed that \`runtime.lock.json\` is the only tracked change
          - explicitly dispatched the ordinary CI workflow for the generated commit

          The pull request remains draft for review of the immutable URL, version, digest, and payload contract.
          EOF

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${{ steps.release.outputs.branch }}" \
            --draft \
            --title "Pin Hara Studio runtime $VERSION" \
            --body-file "$BODY")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Dispatch and require ordinary branch CI
        shell: bash
        run: |
          BRANCH="${{ steps.release.outputs.branch }}"
          COMMIT=$(git rev-parse HEAD)
          gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$BRANCH"

          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow ci.yml \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$COMMIT\") | .databaseId" \
              | head -n 1)
            [ -n "$RUN_ID" ] && break
            sleep 2
          done
          [ -n "$RUN_ID" ] || {
            echo "unable to find the dispatched CI run for $COMMIT" >&2
            exit 1
          }
          gh run watch "$RUN_ID" --repo "${{ github.repository }}" --exit-status
          printf 'Prepared runtime update PR: %s\n' "${{ steps.pull_request.outputs.url }}"
