name: Patch Hodos Graph verifier interaction

on:
  push:
    branches: [agent/hodos-2d-browser-proof]
    paths: [.github/workflows/patch-hodos-graph-verifier.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-2d-browser-proof
          fetch-depth: 0

      - name: Replace mixed synthetic pointer input with real click and drag
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-hodos-graph-project-open.mjs')
          source = path.read_text(encoding='utf-8')
          start_marker = '  await page.locator(\'[data-graph-drag-handle="node/transform"]\').dispatchEvent("pointerdown"'
          end_marker = '\n\n  assert.deepEqual(pageErrors'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'Unable to locate Graph verifier interaction block: start={start}, end={end}')

          replacement = '''  const transformHandle = '[data-graph-drag-handle="node/transform"]';
          await page.click(transformHandle);
          await page.waitForFunction(() =>
            document.querySelector('[data-node-id="node/transform"]')?.classList.contains("selected"),
          null,
          { timeout: 5_000 });

          const handle = page.locator(transformHandle);
          const box = await handle.boundingBox();
          assert.ok(box, "graph drag handle has no bounds");
          const startX = box.x + box.width / 2;
          const startY = box.y + box.height / 2;
          await page.mouse.move(startX, startY);
          await page.mouse.down();
          await page.mouse.move(startX + 90, startY + 60, { steps: 8 });
          await page.mouse.up();

          await page.waitForTimeout(150);
          const postDrag = await page.evaluate(() => ({
            left: parseFloat(document.querySelector('[data-node-id="node/transform"]')?.style.left || "0"),
            revision: document.querySelector(".hodos-2d-graph-toolbar span")?.textContent || "",
            selected: document.querySelector('[data-node-id="node/transform"]')?.classList.contains("selected") || false,
            repl: document.querySelector("#repl-output")?.textContent || "",
          }));
          console.log("Hodos Graph post-drag diagnostic", JSON.stringify(postDrag));
          assert.equal(postDrag.selected, true, `Hodos Graph selection was lost: ${JSON.stringify(postDrag)}`);
          assert.ok(postDrag.left > initial.transformLeft + 70, `Hodos Graph node did not move: ${JSON.stringify(postDrag)}`);
          assert.match(postDrag.revision, /revision 1/, `Hodos Graph revision did not advance: ${JSON.stringify(postDrag)}`);'''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY

      - name: Validate and commit only the verifier correction
        run: |
          node --check scripts/verify-hodos-graph-project-open.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-hodos-graph-project-open.mjs
          git diff --cached --check
          git commit -m "Use real pointer input for the Hodos Graph browser proof"
          git push origin HEAD:agent/hodos-2d-browser-proof
