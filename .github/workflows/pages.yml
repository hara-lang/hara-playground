name: Deploy Hara Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Merged hara-lang/hara#335. This exact revision packages the HTA browser
      # module imported by hta.js, hta-worker.js and hta-shared-worker.js,
      # together with the Supersonic provider and HAL namespace.
      HARA_RUNTIME_SOURCE_REF: c3c345f0e0d18d499c39d82b8f4bcb98e4ebb4f6
      # This is the gitlink recorded by the Hara source pin. Check it out
      # explicitly over HTTPS instead of relying on Hara's SSH submodule URL.
      HARA_UI_SOURCE_REF: 145a9acc728f71f9aa215868a22774ea07d466d4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check out verified Hara runtime source
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_RUNTIME_SOURCE_REF }}
          path: .hara-runtime-source
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the pinned Hara UI build input
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-ui
          ref: ${{ env.HARA_UI_SOURCE_REF }}
          path: .hara-runtime-source/website/vendor/hara-ui
          fetch-depth: 1
          persist-credentials: false

      - name: Build and install verified Hara runtime
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_REF=$(git -C .hara-runtime-source rev-parse HEAD)
          if [ "$ACTUAL_REF" != "$HARA_RUNTIME_SOURCE_REF" ]; then
            echo "Hara checkout resolved to $ACTUAL_REF, expected $HARA_RUNTIME_SOURCE_REF" >&2
            exit 1
          fi
          ACTUAL_UI_REF=$(git -C .hara-runtime-source/website/vendor/hara-ui rev-parse HEAD)
          if [ "$ACTUAL_UI_REF" != "$HARA_UI_SOURCE_REF" ]; then
            echo "Hara UI checkout resolved to $ACTUAL_UI_REF, expected $HARA_UI_SOURCE_REF" >&2
            exit 1
          fi

          OUT="$RUNNER_TEMP/hara-studio-runtime"
          BUILD_LOG="$RUNNER_TEMP/hara-studio-runtime-build.log"
          set +e
          HARA_STUDIO_RUNTIME_OUT="$OUT" \
            .hara-runtime-source/scripts/build-studio-runtime ci 2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::group::Hara Studio runtime failure tail"
            tail -n 60 "$BUILD_LOG"
            echo "::endgroup::"
            while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\r'/'%0D'}
              escaped=${escaped//$'\n'/'%0A'}
              echo "::error title=Hara Studio runtime build failed::$escaped"
            done < <(tail -n 16 "$BUILD_LOG")
            exit "$BUILD_STATUS"
          fi

          ARCHIVE="$OUT/hara-studio-runtime-ci.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"
          test -s "$ARCHIVE"
          test -s "$CHECKSUM"
          sha256sum -c "$CHECKSUM"

          STAGE="$RUNNER_TEMP/hara-runtime-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"

          # The checksum authenticates the transport archive. It is not part
          # of the browser runtime and must not be copied into the public site.
          find "$STAGE" -maxdepth 1 -type f \
            -name 'hara-studio-runtime-*.tar.gz.sha256' -delete

          REQUIRED=(
            rust/hara.wasm
            rust/hta.js
            rust/hta-worker.js
            rust/hta-shared-worker.js
            rust/packages/hta/index.js
            rust/packages/hta/worker.js
            rust/packages/hta/shared-worker.js
            rust/host/broker.js
            rust/host/services.js
            rust/studio/supersonic.js
            rust/studio/hal/supersonic.hal
          )
          for path in "${REQUIRED[@]}"; do
            if [ ! -f "$STAGE/$path" ]; then
              echo "built runtime is missing required payload: $path" >&2
              exit 1
            fi
          done

          rm -rf runtime
          mkdir -p runtime
          cp -a "$STAGE/." runtime/

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify public Supersonic deployment
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Match public assets to the deployed commit
        env:
          HARA_PLAYGROUND_URL: ${{ needs.deploy.outputs.page_url }}
          HARA_PLAYGROUND_COMMIT: ${{ github.sha }}
        run: node scripts/verify-pages-deployment.mjs
      - name: Install pinned browser smoke tooling
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium
      - name: Exercise the public Supersonic project
        env:
          HARA_PLAYGROUND_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify-live-supersonic.mjs
