name: Fix redundant Hodos Document controller updates

on:
  push:
    branches: [agent/hodos-2d-browser-proof]
    paths: [.github/workflows/fix-redundant-document-controller.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-2d-browser-proof
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Skip shell updates for identical Document state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/events.js')
          source = path.read_text(encoding='utf-8')
          old = '''async function applyDocumentWorkspacePatch(patch) {
            const view = state.workspaceShell?.view;
            if (!view) throw new Error("The current Workspace has no document model");
            state.workspaceShell.view = patch.kind === "select"
              ? selectWorkspaceDocumentNode(view, patch)
              : editWorkspaceDocumentText(view, patch);
            updateHodosWorkspaceShell(state);
          }
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''async function applyDocumentWorkspacePatch(patch) {
            const view = state.workspaceShell?.view;
            if (!view) throw new Error("The current Workspace has no document model");
            const next = patch.kind === "select"
              ? selectWorkspaceDocumentNode(view, patch)
              : editWorkspaceDocumentText(view, patch);
            if (next === view) return;
            state.workspaceShell.view = next;
            updateHodosWorkspaceShell(state);
          }
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected one Document controller anchor, found {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate the controller repair
        run: |
          node --check src/app/events.js
          npm test
          npm run check
          npm run build

      - name: Commit only the product repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/events.js
          git diff --cached --check
          git commit -m "Skip redundant Hodos document shell updates"
          git push origin HEAD:agent/hodos-2d-browser-proof
