name: Apply Hodos Catalog consumer migration

on:
  push:
    branches: [agent/hodos-catalog]
    paths: [.github/workflows/apply-hodos-catalog.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-catalog
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the migration program
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/scripts/apply-hodos-catalog.py').read_text(encoding='utf-8')
          compile(source, '.github/scripts/apply-hodos-catalog.py', 'exec')
          PY

      - name: Pin the merged Hodos Catalog boundary
        run: |
          git -C vendor/hodos fetch origin 940289542afeb33cd2a2ce97ea6ba9c41258b426
          git -C vendor/hodos checkout 940289542afeb33cd2a2ce97ea6ba9c41258b426

      - name: Apply the Playground Catalog consumer
        run: python3 .github/scripts/apply-hodos-catalog.py

      - name: Align the projection test with the package preparation lifecycle
        run: |
          cat > tests/hodos-catalog-projection.test.js <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          const host = fs.readFileSync(new URL("../src/hodos/catalog.js", import.meta.url), "utf8");

          function section(start, end) {
            const from = host.indexOf(start);
            const to = host.indexOf(end, from + start.length);
            assert.notEqual(from, -1, `missing ${start}`);
            assert.notEqual(to, -1, `missing ${end}`);
            return host.slice(from, to);
          }

          test("Catalog projects descriptive tool and activity records without executable fields", () => {
            const toolProjection = section("const projectedToolsets", "const projectedActivities");
            const activityProjection = section("const projectedActivities", "let toolsAreaHost");
            const runProjection = section("function catalogRunFromPlayground", "export function catalogAreaFromPlayground");

            assert.match(toolProjection, /id: tool\.id/);
            assert.match(toolProjection, /description: tool\.description/);
            assert.doesNotMatch(toolProjection, /\bsnippet\s*:/);

            assert.match(activityProjection, /instructions:/);
            assert.match(activityProjection, /checkCount:/);
            assert.doesNotMatch(activityProjection, /\bsource\s*:/);
            assert.doesNotMatch(activityProjection, /\bchecks\s*:/);

            assert.match(runProjection, /status: check\.passed/);
            assert.doesNotMatch(runProjection, /\bexpression\s*:/);
            assert.doesNotMatch(runProjection, /\bexpr\s*:/);
          });
          EOF

      - name: Validate changed JavaScript
        run: |
          node --check src/hodos/catalog-events.js
          node --check src/hodos/catalog.js
          node --check src/app/events.js
          node --check src/app/view.js
          node --check src/main.js
          node --check tests/hodos-catalog-events.test.js
          node --check tests/hodos-catalog-projection.test.js
          node --check tests/hodos-catalog-authority.test.js

      - name: Run the complete Playground gates
        run: |
          npm test
          npm run check
          npm run build

      - name: Commit the validated consumer migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mount developer catalog through Hodos Dev"
          git push origin HEAD:agent/hodos-catalog
