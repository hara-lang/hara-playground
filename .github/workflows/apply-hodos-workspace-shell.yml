name: Apply Hodos Workspace shell consumer migration

on:
  push:
    branches: [agent/hodos-workspace-shell]
    paths: [.github/workflows/apply-hodos-workspace-shell.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hodos-workspace-shell
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the migration program
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/scripts/apply-hodos-workspace-shell.py').read_text(encoding='utf-8')
          compile(source, '.github/scripts/apply-hodos-workspace-shell.py', 'exec')
          PY

      - name: Pin the merged Hodos Workspace shell boundary
        run: |
          git -C vendor/hodos fetch origin 3128fd9bf03c203c5a35f409b94e59553bf33aa3
          git -C vendor/hodos checkout 3128fd9bf03c203c5a35f409b94e59553bf33aa3

      - name: Apply the manifest-driven Playground shell
        run: python3 .github/scripts/apply-hodos-workspace-shell.py

      - name: Validate changed JavaScript
        run: |
          node --check src/workspace/manifest.js
          node --check src/hodos/workspace-shell-state.js
          node --check src/hodos/workspace-shell-events.js
          node --check src/hodos/workspace-shell.js
          node --check src/app/workspace-assist.js
          node --check src/app/context.js
          node --check src/app/actions.js
          node --check src/app/events.js
          node --check src/app/view.js
          node --check src/main.js
          node --check tests/workspace-manifest.test.js
          node --check tests/hodos-workspace-shell-projection.test.js
          node --check tests/hodos-workspace-shell-events.test.js
          node --check tests/hodos-workspace-shell-authority.test.js
          node --check tests/workspace-layout-contract.test.js
          node --check scripts/verify-supersonic-project-open.mjs

      - name: Run the complete Playground gates
        run: |
          npm test
          npm run check
          npm run build

      - name: Commit the validated consumer migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Drive the Playground shell from workspace.edn"
          git push origin HEAD:agent/hodos-workspace-shell
